name: Build APK

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        run: |
          base=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            sha="${{ github.event.pull_request.head.sha || github.sha }}"
            version="${base}-rc.${sha:0:7}"
            tag="v${version}"
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $version (tag $tag)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret available (e.g. PR from a fork); using debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --build-name "${{ steps.ver.outputs.version }}" --build-number "${{ github.run_number }}"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "shiftviewer-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shiftviewer-${{ steps.ver.outputs.version }}
          path: shiftviewer-${{ steps.ver.outputs.version }}.apk

      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: shiftviewer-${{ steps.ver.outputs.version }}.apk
